[project]
name = "powerusage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "protobuf>=7.34.1",
    "requests>=2.33.1",
    "robotpy-wpiutil>=2026.2.2",
]

[project.scripts]
plot = "src.main:main"

[build-system]
requires = ["hatchling"]
